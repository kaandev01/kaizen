# GitHub Pages'e otomatik yayın: main dalına her push'ta test + derleme + yayın.
# Kurulum: repo → Settings → Pages → Source: "GitHub Actions".
name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Repo → Settings → Secrets and variables → Actions'a eklenir (bkz. README →
          # "Bulut senkron / kullanıcı girişi" kurulumu). Tanımlı değilse uygulama
          # bulutsuz modda derlenir — build kırılmaz, yalnızca giriş ekranı
          # "yapılandırma eksik" uyarısı gösterir.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
